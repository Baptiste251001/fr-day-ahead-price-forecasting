[project]
name = "fr-power-spread-ou"
version = "0.1.0"
description = "Intraday vs day-ahead electricity price spread forecasting and OU-based optimal-stopping trading for the French power market."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Baptiste Millard" }]

dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.12,<2.0",
    "statsmodels>=0.14,<0.15",
    "scikit-learn>=1.4,<2.0",
    "lightgbm>=4.3,<5.0",
    "torch>=2.2,<3.0",
    "entsoe-py>=0.6.5,<0.7",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "pyyaml>=6.0,<7.0",
    "typer>=0.12,<0.13",
    "click>=8.1,<8.2",  # typer 0.12 is incompatible with click>=8.2's Parameter.make_metavar signature
    "python-dotenv>=1.0,<2.0",
    "pyarrow>=16.0,<21.0",
    "matplotlib>=3.8,<4.0",
    "holidays>=0.47,<1.0",
    "requests>=2.31,<3.0",
    "tqdm>=4.66,<5.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4,<0.5",
    "mypy>=1.9,<2.0",
    "pytest>=8.1,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pre-commit>=3.7,<4.0",
    "types-requests>=2.31,<3.0",
    "types-pyyaml>=6.0,<7.0",
]
notebooks = [
    "jupyterlab>=4.1,<5.0",
    "ipykernel>=6.29,<7.0",
    "plotly>=5.20,<6.0",
]

[project.scripts]
fr-power = "fr_power.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fr_power"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["fr_power"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
