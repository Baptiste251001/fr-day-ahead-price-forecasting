[project]
name = "fr-power"
version = "1.0.0"
description = "Walk-forward forecasting of French day-ahead electricity prices from ENTSO-E data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["electricity price forecasting", "day-ahead market", "energy", "ENTSO-E", "France"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]
authors = [{ name = "Baptiste Malard" }]

dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.12,<2.0",
    "scikit-learn>=1.4,<2.0",
    "lightgbm>=4.7,<5.0",
    "entsoe-py>=0.6.5,<0.7",
    "pydantic>=2.6,<3.0",
    "pyyaml>=6.0,<7.0",
    "typer>=0.12,<0.13",
    "click>=8.1,<8.2",  # typer 0.12 breaks with click>=8.2
    "python-dotenv>=1.0,<2.0",
    "pyarrow>=16.0,<21.0",
    "matplotlib>=3.8,<4.0",
    "holidays>=0.47,<1.0",
    "requests>=2.31,<3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4,<0.5",
    "mypy>=1.9,<2.0",
    "pytest>=8.1,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pre-commit>=3.7,<4.0",
    "types-requests>=2.31,<3.0",
    "types-pyyaml>=6.0,<7.0",
]
notebooks = [
    "jupyterlab>=4.1,<5.0",
    "ipykernel>=6.29,<7.0",
]

[project.urls]
Repository = "https://github.com/Baptiste251001/fr-day-ahead-price-forecasting"

[project.scripts]
fr-power = "fr_power.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fr_power"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
# E501 is handled by ruff format; N803/N806 allow the scikit-learn `X` convention.
ignore = ["E501", "N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["fr_power"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
